# Replit Configuration for Production Deployment
[deployment]
deploymentTarget = "autoscale"
build = ["sh", "-c", "NODE_ENV=production npm run build"]
run = ["sh", "-c", "NODE_ENV=production npm start"]

[env]
NODE_ENV = "production"
PORT = "5000"
HOST = "0.0.0.0"

[[ports]]
localPort = 5000
externalPort = 80

[deployment.env]
NODE_ENV = "production"
PORT = "5000"
HOST = "0.0.0.0"